  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;splitupi-ux-blueprint&#x27;);
      const phone = document.getElementById(&#x27;su-phone&#x27;);
      const screen = document.getElementById(&#x27;su-screen&#x27;);
      const title = document.getElementById(&#x27;su-appbar-title&#x27;);
      const back = document.getElementById(&#x27;su-back&#x27;);
      const caption = document.getElementById(&#x27;su-screen-caption&#x27;);
      const saved = globalThis.openai?.widgetState || {};
      let current = saved.modelContent?.currentScreen || &#x27;home&#x27;;
      let source = saved.modelContent?.source || &#x27;camera&#x27;;
      const design = {
        radius: saved.privateContent?.design?.radius ?? 18,
        accent: saved.privateContent?.design?.accent ?? &#x27;green&#x27;,
        homeLayout: saved.privateContent?.design?.homeLayout ?? &#x27;stacked&#x27;,
        showRecent: saved.privateContent?.design?.showRecent ?? true
      };

      const labels = {
        home: &#x27;Home&#x27;, text: &#x27;Text entry&#x27;, camera: &#x27;Camera scanner&#x27;, photos: &#x27;Phone media&#x27;,
        details: &#x27;Payment details&#x27;, split: &#x27;Choose split&#x27;, review: &#x27;Review split&#x27;, apps: &#x27;Choose UPI app&#x27;,
        payment: &#x27;Payment progress&#x27;, success: &#x27;Successful return&#x27;, submitted: &#x27;Submitted return&#x27;,
        unknown: &#x27;Unknown return&#x27;, failure: &#x27;Failed return&#x27;

      function icon(name) {
        return `&lt;i data-lucide=&quot;${name}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
      }

      function homeScreen() {
        const entryClass = design.homeLayout === &#x27;compact&#x27; ? &#x27;su-entry-list is-compact&#x27; : &#x27;su-entry-list&#x27;;
        const entryItemClass = design.homeLayout === &#x27;compact&#x27; ? &#x27;su-entry is-compact&#x27; : &#x27;su-entry&#x27;;
        const recent = design.showRecent ? `
          &lt;div class=&quot;su-section-label&quot;&gt;Continue payment&lt;/div&gt;
          &lt;button type=&quot;button&quot; class=&quot;su-session&quot; data-go=&quot;payment&quot;&gt;
            &lt;span class=&quot;su-row&quot;&gt;&lt;strong&gt;ABC Restaurant&lt;/strong&gt;&lt;span&gt;2 / 5&lt;/span&gt;&lt;/span&gt;
            &lt;span class=&quot;su-subtle&quot;&gt;₹6,000 remaining&lt;/span&gt;
            &lt;span class=&quot;su-progress-track&quot;&gt;&lt;span class=&quot;su-progress-fill&quot; style=&quot;display:block;width:40%&quot;&gt;&lt;/span&gt;&lt;/span&gt;
          &lt;/button&gt;` : &#x27;&#x27;;
        return `
          &lt;div class=&quot;su-logo&quot;&gt;₹÷&lt;/div&gt;
          &lt;div&gt;&lt;h2&gt;Split a UPI payment&lt;/h2&gt;&lt;p class=&quot;su-subtle&quot;&gt;Choose how you want to add payment details.&lt;/p&gt;&lt;/div&gt;

            &lt;/button&gt;
            &lt;button type=&quot;button&quot; class=&quot;${entryItemClass}&quot; data-go=&quot;camera&quot;&gt;
              ${icon(&#x27;scan-line&#x27;)}&lt;span class=&quot;su-entry-copy&quot;&gt;&lt;strong&gt;Scan QR&lt;/strong&gt;&lt;small&gt;Use the camera&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;su-entry-arrow&quot;&gt;›&lt;/span&gt;
            &lt;/button&gt;
            &lt;button type=&quot;button&quot; class=&quot;${entryItemClass}&quot; data-go=&quot;photos&quot;&gt;
              ${icon(&#x27;image&#x27;)}&lt;span class=&quot;su-entry-copy&quot;&gt;&lt;strong&gt;Choose photo&lt;/strong&gt;&lt;small&gt;Scan a saved QR image&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;su-entry-arrow&quot;&gt;›&lt;/span&gt;
            &lt;/button&gt;
          &lt;/div&gt;${recent}`;
      }

      const screens = {
        home: homeScreen,
        text: () =&gt; `
          &lt;div&gt;&lt;h2&gt;Enter payment details&lt;/h2&gt;&lt;p class=&quot;su-subtle&quot;&gt;All fields are required.&lt;/p&gt;&lt;/div&gt;
          &lt;div class=&quot;su-field&quot;&gt;&lt;label for=&quot;su-vpa&quot;&gt;VPA&lt;/label&gt;&lt;input id=&quot;su-vpa&quot; value=&quot;restaurant@upi&quot; inputmode=&quot;email&quot;&gt;&lt;/div&gt;

      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
